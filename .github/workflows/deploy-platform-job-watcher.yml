# @format
# Deploy Platform-Job-Watcher (Development)
# Builds platform-job-watcher, pushes to ECR.
# ArgoCD Image Updater monitors the ECR repo and rolls out the Deployment
# automatically — no SSM write step needed.
# Prerequisite: ECR repo provisioned via shared-infra CDK stack.

name: "Deploy Platform-Job-Watcher (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/platform-job-watcher/**"
      - ".github/workflows/deploy-platform-job-watcher.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-platform-job-watcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_build-push-image.yml
    with:
      app-name: platform-job-watcher
      dockerfile: applications/platform-job-watcher/Dockerfile
      ecr-ssm-path: /shared/ecr-platform-job-watcher/development/repository-uri
      # image-ssm-path omitted: ArgoCD Image Updater handles rollout
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}
