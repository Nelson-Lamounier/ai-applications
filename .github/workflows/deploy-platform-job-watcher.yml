# @format
# Deploy Platform-Job-Watcher (Development)
# Builds platform-job-watcher, pushes to ECR.
# ArgoCD Image Updater monitors the ECR repo and triggers the Argo Rollout;
# Argo Rollouts then drives the canary promotion sequence to Healthy via its
# AnalysisRun gates (no GitHub-Actions-driven promote step).
# Prerequisite: ECR repo provisioned via shared-infra CDK stack.

name: "Deploy Platform-Job-Watcher (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/platform-job-watcher/**"
      - ".github/workflows/deploy-platform-job-watcher.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-platform-job-watcher-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    uses: ./.github/workflows/_build-push-image.yml
    with:
      app-name: platform-job-watcher
      dockerfile: applications/platform-job-watcher/Dockerfile
      ecr-ssm-path: /shared/ecr-platform-job-watcher/development/repository-uri
      # image-ssm-path omitted: ArgoCD Image Updater handles rollout trigger
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  deploy-marker:
    name: Loki deploy marker
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute aggregate status
        id: agg
        env:
          STATUSES: ${{ toJSON(needs) }}
        run: |
          if echo "$STATUSES" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/loki-deploy-marker
        env:
          LOKI_PUSH_URL:        ${{ secrets.LOKI_PUSH_URL }}
          LOKI_PUSH_BASIC_AUTH: ${{ secrets.LOKI_PUSH_BASIC_AUTH }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          PUSHGATEWAY_BASIC_AUTH: ${{ secrets.PUSHGATEWAY_BASIC_AUTH }}
        with:
          service:     platform-job-watcher
          environment: development
          status:      ${{ steps.agg.outputs.status }}
          git-sha:     ${{ github.sha }}
          notes:       "platform-job-watcher image push (ArgoCD/Argo Rollouts handles rollout)"
