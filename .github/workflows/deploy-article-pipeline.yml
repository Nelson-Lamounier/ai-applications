# @format
# Deploy Article-Pipeline (Development)
# Builds @bedrock/article-pipeline, pushes to ECR, writes image URI to SSM.
# Prerequisite: ECR repo provisioned via shared-infra CDK stack.

name: "Deploy Article-Pipeline (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/article-pipeline/**"
      - "applications/shared/**"
      - ".github/workflows/deploy-article-pipeline.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-article-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_build-push-image.yml
    with:
      app-name: article-pipeline
      dockerfile: applications/article-pipeline/Dockerfile
      ecr-ssm-path: /shared/ecr-article-pipeline/development/repository-uri
      image-ssm-path: /k8s/development/job-images/article-pipeline
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}
