# =============================================================================
# Deploy Article-Pipeline Job Image (Development)
# =============================================================================
#
# Builds the @bedrock/article-pipeline container, pushes to ECR, and updates
# the /article-pipeline/{env}/image-uri SSM parameter consumed by the K8s
# manifests (via admin-api ConfigMap or ArgoCD Image Updater).
#
# Prerequisite: ECR repo must exist with its URI published at
#   /shared/ecr-article-pipeline/{env}/repository-uri
# Provision via the shared-infra CDK stack (or AWS console) BEFORE first run.
# This workflow does NOT create the ECR repository.
# =============================================================================

name: "Deploy Article-Pipeline (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/article-pipeline/**"
      - "applications/shared/**"
      - ".github/workflows/deploy-article-pipeline.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: development
  AWS_REGION: "eu-west-1"
  IMAGE_TAG: "${{ github.sha }}-r${{ github.run_attempt }}"

concurrency:
  group: deploy-article-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "[Article-Pipeline] Build Docker Image"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (article-pipeline)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: applications/article-pipeline/Dockerfile
          push: false
          load: false
          tags: article-pipeline:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=article-pipeline
          cache-to: type=gha,mode=max,scope=article-pipeline
          provenance: false
          outputs: type=docker,dest=/tmp/article-pipeline-image.tar

      - name: Cache Article-Pipeline Image
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: /tmp/article-pipeline-image.tar
          key: article-pipeline-image-${{ env.ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Summary
        run: |
          IMAGE_SIZE=$(du -sh /tmp/article-pipeline-image.tar | cut -f1)
          echo "## [Article-Pipeline] Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $IMAGE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: applications/article-pipeline/Dockerfile" >> $GITHUB_STEP_SUMMARY

  push:
    name: "[Article-Pipeline] Push to ECR"
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore Article-Pipeline Image from Cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: /tmp/article-pipeline-image.tar
          key: article-pipeline-image-${{ env.ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Load Docker Image
        run: docker load -i /tmp/article-pipeline-image.tar

      - name: Resolve ECR URL (article-pipeline)
        id: resolve-ecr
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "/shared/ecr-article-pipeline/${{ env.ENVIRONMENT }}/repository-uri" \
            --query 'Parameter.Value' \
            --output text)

          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            echo "::error::article-pipeline ECR URL not found at /shared/ecr-article-pipeline/${{ env.ENVIRONMENT }}/repository-uri — provision the ECR repo first"
            exit 1
          fi

          echo "::add-mask::$ECR_URL"
          echo "ecr-url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Push Article-Pipeline Image to ECR
        run: |
          ECR_URL="${{ steps.resolve-ecr.outputs.ecr-url }}"
          TAG="${{ env.IMAGE_TAG }}"

          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$ECR_URL"

          docker tag "article-pipeline:${TAG}" "${ECR_URL}:${TAG}"
          docker push "${ECR_URL}:${TAG}"

      - name: Publish image URI to SSM
        # Decoupled from admin-api Rollout — see deploy-ingestion.yml header.
        run: |
          ECR_URL="${{ steps.resolve-ecr.outputs.ecr-url }}"
          TAG="${{ env.IMAGE_TAG }}"
          aws ssm put-parameter \
            --name "/k8s/${{ env.ENVIRONMENT }}/job-images/article-pipeline" \
            --value "${ECR_URL}:${TAG}" \
            --type String \
            --overwrite

      - name: Push Summary
        run: |
          echo "## [Article-Pipeline] ECR Push" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SSM**: \`/k8s/${{ env.ENVIRONMENT }}/job-images/article-pipeline\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Path to admin-api**: SSM → ESO → Secret → file mount (no pod restart)" >> $GITHUB_STEP_SUMMARY
