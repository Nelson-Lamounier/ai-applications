# @format
# Deploy Resume-Import-Processor (Development)
# Builds the resume-import-processor container, pushes to ECR, writes image URI to SSM.
# The admin-api reads the URI from the SSM-backed Secret file mount (ESO sync).
# Prerequisite: ECR repo provisioned via shared-infra CDK stack.

name: "Deploy Resume-Import-Processor (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/resume-import-processor/**"
      # The image bundles @bedrock/shared (see Dockerfile), so shared-only
      # changes must rebuild it too — otherwise fixes silently never ship.
      - "applications/shared/**"
      - ".github/workflows/deploy-resume-import-processor.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-resume-import-processor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_build-push-image.yml
    with:
      app-name: resume-import-processor
      dockerfile: applications/resume-import-processor/Dockerfile
      ecr-ssm-path: /shared/ecr-resume-import-processor/development/repository-uri
      image-ssm-path: /k8s/development/job-images/resume-import-processor
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  deploy-marker:
    name: Loki deploy marker
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute aggregate status
        id: agg
        env:
          STATUSES: ${{ toJSON(needs) }}
        run: |
          if echo "$STATUSES" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/loki-deploy-marker
        env:
          LOKI_PUSH_URL:        ${{ secrets.LOKI_PUSH_URL }}
          LOKI_PUSH_BASIC_AUTH: ${{ secrets.LOKI_PUSH_BASIC_AUTH }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          PUSHGATEWAY_BASIC_AUTH: ${{ secrets.PUSHGATEWAY_BASIC_AUTH }}
        with:
          service:     resume-import-processor
          environment: development
          status:      ${{ steps.agg.outputs.status }}
          git-sha:     ${{ github.sha }}
          notes:       "resume-import-processor image push"
