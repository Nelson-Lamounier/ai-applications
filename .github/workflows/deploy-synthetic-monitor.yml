# @format
# Deploy Synthetic-Monitor (Development)
# Builds the synthetic-monitor container and pushes to ECR.
# ArgoCD Image Updater monitors the ECR repo and bumps the CronJob image in the
# monitoring chart (charts/monitoring — syntheticMonitor.image).
# Prerequisite: ECR repo provisioned via shared-infra CDK stack
#   (/shared/ecr-synthetic-monitor/development/repository-uri).

name: "Deploy Synthetic-Monitor (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/synthetic-monitor/**"
      - "applications/shared/**"
      - ".github/workflows/deploy-synthetic-monitor.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-synthetic-monitor-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    uses: ./.github/workflows/_build-push-image.yml
    with:
      app-name: synthetic-monitor
      dockerfile: applications/synthetic-monitor/Dockerfile
      ecr-ssm-path: /shared/ecr-synthetic-monitor/development/repository-uri
      # image-ssm-path omitted: ArgoCD Image Updater handles the rollout trigger
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  deploy-marker:
    name: Loki deploy marker
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute aggregate status
        id: agg
        env:
          STATUSES: ${{ toJSON(needs) }}
        run: |
          if echo "$STATUSES" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/loki-deploy-marker
        env:
          LOKI_PUSH_URL:        ${{ secrets.LOKI_PUSH_URL }}
          LOKI_PUSH_BASIC_AUTH: ${{ secrets.LOKI_PUSH_BASIC_AUTH }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          PUSHGATEWAY_BASIC_AUTH: ${{ secrets.PUSHGATEWAY_BASIC_AUTH }}
        with:
          service:     synthetic-monitor
          environment: development
          status:      ${{ steps.agg.outputs.status }}
          git-sha:     ${{ github.sha }}
          notes:       "synthetic-monitor image push"
