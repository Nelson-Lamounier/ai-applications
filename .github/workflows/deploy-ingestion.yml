# @format
# Deploy Ingestion Worker (Development)
# Builds the ingestion container, pushes to ECR, writes image URI to SSM.
# Prerequisite: ECR repo provisioned via shared-infra CDK stack.

name: "Deploy Ingestion (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/ingestion/**"
      - ".github/workflows/deploy-ingestion.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_build-push-image.yml
    with:
      app-name: ingestion
      dockerfile: applications/ingestion/Dockerfile
      ecr-ssm-path: /shared/ecr-ingestion/development/repository-uri
      image-ssm-path: /k8s/development/job-images/ingestion
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}
