# @format
# @description Deploy Bedrock AI Infrastructure to Development
#
# Deploys the 10-stack Bedrock architecture in dependency order:
#   1. Bedrock-Data               — S3 bucket for Knowledge Base documents + drafts
#   2. Bedrock-Kb                 — Bedrock Knowledge Base (Pinecone vector store)
#   3. Bedrock-Agent              — Bedrock Agent, Knowledge Base, Guardrail
#   4. Bedrock-Api                — API Gateway + Lambda for agent invocation
#   5. Bedrock-Content            — DynamoDB table + legacy monolith publisher
#   6. Bedrock-Pipeline           — Multi-agent Step Functions (Research ~ Writer ~ QA)
#   7. Bedrock-Strategist-Data    — Job Strategist DynamoDB table
#   8. Bedrock-Strategist-Pipeline — Job Strategist (Analysis SM + Coaching SM)
#   9. Bedrock-Aurora             — Aurora Serverless v2 + pgvector (replaces Pinecone)
#  10. Bedrock-Public-Api         — BFF Hono Lambda (articles, chatbot proxy, resumes)
#
# For KB document syncing (without deploying stacks), use sync-kb-docs.yml.

name: Deploy Bedrock (Dev)

on:
  workflow_dispatch: {}
  # push:
  #   branches: [develop]
  #   paths:
  #     - "infra/lib/stacks/bedrock/**"
  #     - "infra/lib/config/bedrock/**"
  #     - "infra/lib/projects/bedrock/**"
  #     - "applications/article-pipeline/**"
  #     - "applications/shared/**"
  #     - "applications/chatbot/**"
  #     - "infra/bin/app.ts"
  #     - ".github/workflows/deploy-bedrock*.yml"
  #     - ".github/workflows/_deploy-stack.yml"
  #     - ".github/actions/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-bedrock-development
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Stack 1: Data (S3 bucket for KB documents + drafts/published prefixes)
  # ===========================================================================
  deploy-data:
    name: Deploy Data Stack
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Data-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 2: KB (Bedrock Knowledge Base backed by Pinecone)
  # Depends on: Data (S3 bucket for KB data source)
  # ===========================================================================
  deploy-kb:
    name: Deploy KB Stack
    needs: [deploy-data]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Kb-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 3: Agent (Bedrock Agent, Knowledge Base, Guardrail, Action Group)
  # Depends on: Data (S3 bucket for KB data source)
  # ===========================================================================
  deploy-agent:
    name: Deploy Agent Stack
    needs: [deploy-data]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Agent-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 4: API (API Gateway + Lambda for agent invocation)
  # Depends on: Agent (agent alias ARN for Lambda)
  # ===========================================================================
  deploy-api:
    name: Deploy API Stack
    needs: [deploy-agent]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Api-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 5: Content (DynamoDB article metadata table + legacy monolith)
  # Depends on: Data (S3 bucket) + KB (Knowledge Base ID for retrieval)
  #
  # Creates the shared DynamoDB table consumed by both the monolith publisher
  # and the multi-agent Pipeline. The monolith Lambda is pending deprecation.
  # ===========================================================================
  deploy-content:
    name: Deploy Content Stack
    needs: [deploy-data, deploy-kb]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Content-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 6: Pipeline (Multi-Agent Step Functions — Research → Writer → QA)
  # Depends on: Data (S3 bucket) + Content (DynamoDB table for article metadata)
  #
  # Deploys the Step Functions state machine and per-agent Lambdas.
  # Application code: applications/article-pipeline/
  # The admin dashboard triggers executions; this only deploys infrastructure.
  # ===========================================================================
  deploy-pipeline:
    name: Deploy Pipeline Stack
    needs: [deploy-data, deploy-content]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Pipeline-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 7: Strategist Data (DynamoDB for job applications)
  # Depends on: Data (S3 bucket for resume storage)
  #
  # Stateful resources for the job strategist pipeline.
  # Independent lifecycle from pipeline Lambdas.
  # ===========================================================================
  deploy-strategist-data:
    name: Deploy Strategist Data Stack
    needs: [deploy-data]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Strategist-Data-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 8: Strategist Pipeline (Iterative Two-Pipeline Step Functions)
  # Depends on: Data (S3) + Strategist Data (DynamoDB) + Content (resume)
  #
  # 2 state machines:
  #   Analysis SM: Research → Strategist → AnalysisPersist
  #   Coaching SM: CoachLoader → Coach
  # Application code: applications/job-strategist/
  # ===========================================================================
  deploy-strategist-pipeline:
    name: Deploy Strategist Pipeline Stack
    needs: [deploy-data, deploy-strategist-data, deploy-content]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Strategist-Pipeline-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 9: Public API (BFF Hono Lambda — articles, chatbot proxy, resumes)
  # Depends on: Content (DynamoDB), API (chatbot URL + secret), Strategist Data
  #
  # Hono app on Lambda. Proxies chatbot requests to Bedrock-Api (no SDK access).
  # Reads articles from Bedrock-Content DynamoDB and resumes from Strategist Data.
  # ===========================================================================
  deploy-public-api:
    name: Deploy Public API Stack
    needs: [deploy-content, deploy-api, deploy-strategist-data]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Public-Api-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  # ===========================================================================
  # Stack 10: Aurora (Serverless v2 + pgvector — replaces Pinecone)
  # Depends on: Data (namePrefix convention; no CloudFormation cross-stack refs)
  #
  # Self-contained: own VPC, own cluster, schema bootstrapped via Data API.
  # minAcu=0 — cluster pauses after inactivity (cold-start on first query).
  # Can deploy in parallel with all other stacks; gated on deploy-data for
  # a clean pipeline root, not for a hard dependency.
  # ===========================================================================
  deploy-aurora:
    name: Deploy Aurora Stack
    needs: [deploy-data]
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack-name: Bedrock-Aurora-development
      project: bedrock
      environment: development
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      require-approval: never
      use-container: false
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}
