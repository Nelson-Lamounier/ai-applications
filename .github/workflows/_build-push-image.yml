# @format
# =============================================================================
# Build and Push Image (Reusable)
# =============================================================================
#
# Reusable workflow: builds a Docker image from the monorepo, pushes to ECR,
# and optionally writes the image URI to SSM (for ESO-backed apps).
#
# When image-ssm-path is set this workflow also patches the corresponding
# K8s Secret key directly (bypassing the ESO poll interval) so that the
# admin-api file mount picks up the new image within ~60s of the push.
# The ESO will eventually overwrite the patch with the same value on its
# next cycle — the direct patch is purely a speed-up, not a replacement.
#
# Usage:
#   jobs:
#     deploy:
#       uses: ./.github/workflows/_build-push-image.yml
#       with:
#         app-name: article-pipeline
#         dockerfile: applications/article-pipeline/Dockerfile
#         ecr-ssm-path: /shared/ecr-article-pipeline/development/repository-uri
#         image-ssm-path: /k8s/development/job-images/article-pipeline   # omit for ArgoCD Image Updater apps
#       secrets:
#         AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}
# =============================================================================

name: Build and Push Image (Reusable)

on:
  workflow_call:
    inputs:
      app-name:
        description: "App slug — used in job names, image tags, and cache keys (e.g. article-pipeline)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to repo root (e.g. applications/article-pipeline/Dockerfile)"
        required: true
        type: string
      ecr-ssm-path:
        description: "SSM parameter path holding the ECR repository URI"
        required: true
        type: string
      image-ssm-path:
        description: "SSM parameter path to write the full image URI after push. Leave empty for ArgoCD Image Updater apps."
        required: false
        type: string
        default: ""
      k8s-secret-namespace:
        description: "Namespace of the K8s Secret to patch immediately after SSM update (bypasses ESO poll delay)."
        required: false
        type: string
        default: "admin-api"
      k8s-secret-name:
        description: "Name of the K8s Secret to patch immediately after SSM update."
        required: false
        type: string
        default: "admin-api-job-images"
      eks-cluster-name:
        description: "EKS cluster name used to generate kubeconfig for the direct K8s secret patch."
        required: false
        type: string
        default: "k8s-eks-development"
      build-timeout:
        description: "Build job timeout in minutes"
        required: false
        type: number
        default: 20
      environment:
        description: "GitHub Actions environment name for secrets/variables"
        required: false
        type: string
        default: development
      aws-region:
        description: "AWS region"
        required: false
        type: string
        default: eu-west-1
    secrets:
      AWS_OIDC_ROLE:
        required: true

jobs:
  build:
    name: "[${{ inputs.app-name }}] Build"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build-timeout }}
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: "${{ github.sha }}-r${{ github.run_attempt }}"
      APP_NAME: ${{ inputs.app-name }}
      DOCKERFILE: ${{ inputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          load: false
          tags: ${{ inputs.app-name }}:${{ github.sha }}-r${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ inputs.app-name }}
          cache-to: type=gha,mode=min,scope=${{ inputs.app-name }}
          provenance: false
          outputs: type=docker,dest=/tmp/${{ inputs.app-name }}-image.tar

      # Hand the built image to the push job via an ARTIFACT, not actions/cache.
      # actions/cache is subject to the 10GB repo cache LRU eviction — under cache
      # pressure (BuildKit layer blobs accumulate) the just-built image tar can be
      # evicted before the push job restores it, failing the deploy on a cache miss.
      # Artifacts have a separate quota and are not LRU-evicted mid-run.
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-name }}-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/${{ inputs.app-name }}-image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Build Summary
        run: |
          IMAGE_SIZE=$(du -sh "/tmp/${APP_NAME}-image.tar" | cut -f1)
          echo "## [${APP_NAME}] Docker Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Size**: ${IMAGE_SIZE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dockerfile**: ${DOCKERFILE}" >> "$GITHUB_STEP_SUMMARY"

  push:
    name: "[${{ inputs.app-name }}] Push to ECR"
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: "${{ github.sha }}-r${{ github.run_attempt }}"
      APP_NAME: ${{ inputs.app-name }}
      ECR_SSM_PATH: ${{ inputs.ecr-ssm-path }}
      IMAGE_SSM_PATH: ${{ inputs.image-ssm-path }}
      AWS_REGION: ${{ inputs.aws-region }}
      K8S_SECRET_NAMESPACE: ${{ inputs.k8s-secret-namespace }}
      K8S_SECRET_NAME: ${{ inputs.k8s-secret-name }}
      EKS_CLUSTER_NAME: ${{ inputs.eks-cluster-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ inputs.aws-region }}

      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-name }}-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp

      - name: Load Docker Image
        run: docker load -i "/tmp/${APP_NAME}-image.tar"

      - name: Resolve ECR URL
        id: resolve-ecr
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "$ECR_SSM_PATH" \
            --query 'Parameter.Value' \
            --output text)

          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            echo "::error::ECR URL not found at ${ECR_SSM_PATH} — provision the ECR repo first"
            exit 1
          fi

          echo "::add-mask::$ECR_URL"
          echo "ecr-url=$ECR_URL" >> "$GITHUB_OUTPUT"

      - name: Push to ECR
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_URL"

          docker tag "${APP_NAME}:${IMAGE_TAG}" "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:${IMAGE_TAG}"

      - name: Publish image URI to SSM
        # Only runs when image-ssm-path is provided (ESO-backed apps).
        # ArgoCD Image Updater apps (e.g. platform-job-watcher) leave this empty.
        if: ${{ inputs.image-ssm-path != '' }}
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
        run: |
          aws ssm put-parameter \
            --name "$IMAGE_SSM_PATH" \
            --value "${ECR_URL}:${IMAGE_TAG}" \
            --type String \
            --overwrite

      - name: Patch K8s Secret (bypass ESO poll delay)
        # ESO polls SSM every 15 min. Directly patching the secret here ensures
        # the admin-api file mount picks up the new image within ~60s via kubelet
        # sync, rather than waiting up to 16 min for ESO + kubelet.
        # The secret key name is derived from app-name (matches ESO secretKey).
        # ESO will overwrite this with the same value on its next cycle.
        if: ${{ inputs.image-ssm-path != '' }}
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          IMAGE_URI="${ECR_URL}:${IMAGE_TAG}"
          IMAGE_URI_B64=$(echo -n "$IMAGE_URI" | base64 -w 0)

          kubectl patch secret "$K8S_SECRET_NAME" \
            -n "$K8S_SECRET_NAMESPACE" \
            --type='json' \
            -p="[{\"op\":\"replace\",\"path\":\"/data/${APP_NAME}\",\"value\":\"${IMAGE_URI_B64}\"}]"

          echo "Patched ${K8S_SECRET_NAMESPACE}/${K8S_SECRET_NAME}[${APP_NAME}] → ${IMAGE_URI}"

      - name: Push Summary
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
        run: |
          echo "## [${APP_NAME}] ECR Push" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${ECR_URL}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$IMAGE_SSM_PATH" ]; then
            echo "- **SSM**: \`${IMAGE_SSM_PATH}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Rollout**: SSM + direct K8s secret patch → kubelet file sync (~60s)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Rollout**: ArgoCD Image Updater detects new ECR tag → rolls out Deployment" >> "$GITHUB_STEP_SUMMARY"
          fi
