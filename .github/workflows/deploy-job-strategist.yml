# @format
# Deploy Job-Strategist (Development)
# Builds @bedrock/job-strategist (carries run-pipeline.js + run-coach.js),
# pushes to ECR, writes image URI to SSM.
# Prerequisite: ECR repo provisioned via shared-infra CDK stack.

name: "Deploy Job-Strategist (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/job-strategist/**"
      - "applications/shared/**"
      - ".github/workflows/deploy-job-strategist.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-job-strategist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_build-push-image.yml
    with:
      app-name: job-strategist
      dockerfile: applications/job-strategist/Dockerfile
      ecr-ssm-path: /shared/ecr-job-strategist/development/repository-uri
      image-ssm-path: /k8s/development/job-images/job-strategist
    secrets:
      AWS_OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE }}

  deploy-marker:
    name: Loki deploy marker
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute aggregate status
        id: agg
        env:
          STATUSES: ${{ toJSON(needs) }}
        run: |
          if echo "$STATUSES" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/loki-deploy-marker
        env:
          LOKI_PUSH_URL:        ${{ secrets.LOKI_PUSH_URL }}
          LOKI_PUSH_BASIC_AUTH: ${{ secrets.LOKI_PUSH_BASIC_AUTH }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          PUSHGATEWAY_BASIC_AUTH: ${{ secrets.PUSHGATEWAY_BASIC_AUTH }}
        with:
          service:     job-strategist
          environment: development
          status:      ${{ steps.agg.outputs.status }}
          git-sha:     ${{ github.sha }}
          notes:       "job-strategist image push"
