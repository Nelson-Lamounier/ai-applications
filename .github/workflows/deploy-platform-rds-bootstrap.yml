# =============================================================================
# Deploy Platform RDS Bootstrap Job Image (Development)
# =============================================================================
#
# Builds the @bedrock/platform-rds-bootstrap container, pushes to ECR, and
# publishes the new <repo>:<tag> URI to SSM at
#   /k8s/{env}/job-images/platform-rds-bootstrap
#
# The image is the DDL runner consumed by the kubernetes-bootstrap
# `platform-rds` Helm chart (charts/platform-rds/chart/templates/bootstrap-job.yaml).
# It connects to the live RDS deployed by Nelson-Lamounier/cdk-monitoring
# (PlatformRds-development), reading credentials and host coordinates from
# ESO-synced secrets sourced from /k8s/{env}/platform-rds/*.
#
# Downstream:
#   1. SSM /k8s/{env}/job-images/platform-rds-bootstrap   ← this workflow
#   2. ArgoCD Image Updater (or ESO + chart values)       ← bumps Helm tag
#   3. ArgoCD application 'platform-rds'                  ← redeploys Job
#   4. Bootstrap Job runs idempotent DDL against RDS      ← schema converged
#
# Prerequisite: ECR repo must exist with its URI published at
#   /shared/ecr-platform-rds-bootstrap/{env}/repository-uri
# Provision in cdk-monitoring SharedVpcStack (mirroring ecr-ingestion).
# This workflow fails fast if the SSM parameter is missing.
# =============================================================================

name: "Deploy Platform RDS Bootstrap (Dev)"

on:
  push:
    branches: [develop]
    paths:
      - "applications/platform-rds-bootstrap/**"
      - ".github/workflows/deploy-platform-rds-bootstrap.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: development
  AWS_REGION: "eu-west-1"
  IMAGE_TAG: "${{ github.sha }}-r${{ github.run_attempt }}"

concurrency:
  group: deploy-platform-rds-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "[PlatformRdsBootstrap] Build Docker Image"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (platform-rds-bootstrap)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: applications/platform-rds-bootstrap/Dockerfile
          push: false
          load: false
          tags: platform-rds-bootstrap:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=platform-rds-bootstrap
          cache-to: type=gha,mode=max,scope=platform-rds-bootstrap
          provenance: false
          outputs: type=docker,dest=/tmp/platform-rds-bootstrap-image.tar

      # Hand the built image to the push job via an ARTIFACT, not actions/cache.
      # actions/cache is LRU-evicted under the 10GB repo cache cap — the ~62MB
      # image tar can be evicted before the push job restores it, so the restore
      # fails on fail-on-cache-miss and the migration step is SKIPPED (migrations
      # silently never apply). Artifacts have a separate quota and are not evicted
      # mid-run. Mirrors _build-push-image.yml, which fixed this same bug.
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-rds-bootstrap-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/platform-rds-bootstrap-image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Build Summary
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          IMAGE_SIZE=$(du -sh /tmp/platform-rds-bootstrap-image.tar | cut -f1)
          {
            echo "## [PlatformRdsBootstrap] Docker Build"
            echo "- **Tag**: ${IMAGE_TAG}"
            echo "- **Size**: ${IMAGE_SIZE}"
            echo "- **Dockerfile**: applications/platform-rds-bootstrap/Dockerfile"
          } >> "$GITHUB_STEP_SUMMARY"

  push:
    name: "[PlatformRdsBootstrap] Push to ECR"
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: platform-rds-bootstrap-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp

      - name: Load Docker Image
        run: docker load -i /tmp/platform-rds-bootstrap-image.tar

      - name: Resolve ECR URL (platform-rds-bootstrap)
        id: resolve-ecr
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          SSM_NAME="/shared/ecr-platform-rds-bootstrap/${ENVIRONMENT}/repository-uri"
          ECR_URL=$(aws ssm get-parameter \
            --name "$SSM_NAME" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || echo "")

          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            echo "::error::platform-rds-bootstrap ECR URL not found at $SSM_NAME — provision the ECR repo first (cdk-monitoring SharedVpcStack)"
            exit 1
          fi

          echo "::add-mask::$ECR_URL"
          echo "ecr-url=$ECR_URL" >> "$GITHUB_OUTPUT"

      - name: Push Bootstrap Image to ECR
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_URL"

          docker tag "platform-rds-bootstrap:${IMAGE_TAG}" "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:${IMAGE_TAG}"

      - name: Publish image URI to SSM
        # ArgoCD Image Updater (or chart value sync) consumes this SSM value
        # to bump the platform-rds Helm chart's bootstrap.image.tag. The Job
        # is idempotent (CREATE EXTENSION / TABLE IF NOT EXISTS), so re-runs
        # against an already-bootstrapped DB are safe.
        env:
          ECR_URL: ${{ steps.resolve-ecr.outputs.ecr-url }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          aws ssm put-parameter \
            --name "/k8s/${ENVIRONMENT}/job-images/platform-rds-bootstrap" \
            --value "${ECR_URL}:${IMAGE_TAG}" \
            --type String \
            --overwrite

      - name: Push Summary
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          {
            echo "## [PlatformRdsBootstrap] ECR Push"
            echo "- **Tag**: ${IMAGE_TAG}"
            echo "- **SSM**: \`/k8s/${ENVIRONMENT}/job-images/platform-rds-bootstrap\`"
            echo "- **Path to chart**: SSM → ArgoCD Image Updater → Helm values → Job re-run (idempotent DDL)"
          } >> "$GITHUB_STEP_SUMMARY"

  apply-migrations:
    name: "[PlatformRdsBootstrap] Apply migrations (on-demand Job)"
    needs: [push]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ${{ vars.ENVIRONMENT || 'development' }}
    permissions:
      id-token: write
      contents: read
    env:
      EKS_CLUSTER_NAME: "k8s-eks-development"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply migrations via on-demand bootstrap Job
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

          # The image just published by the push job (latest migration bundle).
          IMAGE=$(aws ssm get-parameter \
            --name /k8s/development/job-images/platform-rds-bootstrap \
            --query Parameter.Value --output text)
          echo "Applying migrations with image: ${IMAGE}"

          # Run the existing break-glass on-demand Job (DDL + every numbered
          # migration, idempotently) directly — no ArgoCD / cross-repo write.
          JOB=$(sed "s|\${IMAGE}|${IMAGE}|g" \
            applications/platform-rds-bootstrap/k8s/bootstrap-job.yaml \
            | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Created job/${JOB} in platform namespace"

          # Stream logs once the pod is up (best-effort; verdict is the wait below).
          kubectl wait --for=condition=ready pod \
            -l "job-name=${JOB}" -n platform --timeout=120s || true
          kubectl logs -n platform -f "job/${JOB}" --tail=-1 || true

          # Verdict: complete within the Job's activeDeadline, else fail the run.
          if kubectl wait --for=condition=complete --timeout=300s "job/${JOB}" -n platform; then
            echo "✅ Migrations applied — job/${JOB} complete."
            exit 0
          fi
          echo "❌ Migration job did not complete — dumping status + logs:"
          kubectl describe "job/${JOB}" -n platform || true
          kubectl logs -n platform "job/${JOB}" --tail=200 || true
          exit 1

  deploy-marker:
    name: Loki deploy marker
    needs: [build, push, apply-migrations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute aggregate status
        id: agg
        env:
          STATUSES: ${{ toJSON(needs) }}
        run: |
          if echo "$STATUSES" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/loki-deploy-marker
        env:
          LOKI_PUSH_URL:        ${{ secrets.LOKI_PUSH_URL }}
          LOKI_PUSH_BASIC_AUTH: ${{ secrets.LOKI_PUSH_BASIC_AUTH }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
          PUSHGATEWAY_BASIC_AUTH: ${{ secrets.PUSHGATEWAY_BASIC_AUTH }}
        with:
          service:     platform-rds-bootstrap
          environment: development
          status:      ${{ steps.agg.outputs.status }}
          git-sha:     ${{ github.sha }}
          notes:       "platform-rds-bootstrap image push"
